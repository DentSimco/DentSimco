<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03060c">
<meta name="color-scheme" content="dark">
<title>DentSimco</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2303060c'/%3E%3Cpath d='M5 21l6-6 5 4 6-9 5 5' fill='none' stroke='%233cefff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<style>
  :root {
    --bg: #03060c;
    --surface: #060c17;
    --raise: #0b1424;
    --raise-2: #101c31;
    --line: #14223a;
    --line-2: #1d3150;
    --text: #d9e6f5;
    --muted: #8397b3;
    --faint: #536684;
    --accent: #8fd3ff;
    --on-accent: #02111c;
    --price: #3cefff;
    --up: #46f0a0;
    --down: #ff5f7e;
    --late: #ffbe4a;
    --low: #72ff8f;
    --high: #ffbe4a;
    --font: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-c: "Barlow Semi Condensed", "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--bg); color: var(--text); font: 400 16px/1.45 var(--font); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
  }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .price, .chg, dd, td, .lg-val, .product-id, .pid, .dayrange, .qtag { font-variant-numeric: tabular-nums; }

  /* Üst menü */
  .top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
    max-width: 1240px; margin: 0 auto; padding: 14px 20px 12px;
  }
  .brand { display: inline-flex; align-items: center; gap: 9px; color: var(--text); text-decoration: none; font: 600 21px/1 var(--font-c); }
  .brand svg { width: 24px; height: 24px; }
  .modules { display: flex; gap: 2px; }
  .modules a { padding: 8px 12px; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 500; }
  .modules a:hover { color: var(--text); }
  .modules a[aria-current="page"] { color: var(--text); background: var(--raise); }
  .subnav { display: none; gap: 2px; padding: 6px 16px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
  .subnav.on { display: flex; }
  .subnav a { padding: 7px 12px; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 500; white-space: nowrap; }
  .subnav a:hover { color: var(--text); }
  .subnav a[aria-current="page"] { color: var(--text); background: var(--raise); }
  .realm { margin-left: auto; display: flex; padding: 3px; border: 1px solid var(--line); border-radius: 11px; }
  .realm button { min-width: 44px; height: 32px; padding: 0 10px; border-radius: 8px; color: var(--muted); font: 600 15px/1 var(--font-c); }
  .realm button[aria-pressed="true"] { background: var(--raise-2); color: var(--accent); }
  @media (max-width: 600px) {
    .top { padding: 12px 14px 8px; }
    .modules { order: 3; width: 100%; overflow-x: auto; scrollbar-width: none; }
  }

  main { max-width: 1240px; margin: 0 auto; padding: 4px 20px 48px; }
  @media (max-width: 600px) { main { padding: 2px 12px 40px; } }

  /* Borsa düzeni */
  .borsa { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "bar" "alert" "hero" "plot" "quality"; }
  .bar { grid-area: bar; }
  .alert { grid-area: alert; }
  .hero { grid-area: hero; }
  .plot { grid-area: plot; }
  .quality { grid-area: quality; }
  @media (min-width: 1180px) {
    .borsa { grid-template-columns: minmax(0, 1fr) 500px; grid-template-areas: "bar bar" "alert alert" "hero quality" "plot quality"; align-items: start; }
    .quality { position: sticky; top: 16px; }
  }

  /* Ürün ve kalite */
  .pick { position: relative; }
  .product {
    display: flex; align-items: center; gap: 10px; width: 100%; min-height: 50px; padding: 10px 14px;
    border: 1px solid var(--line-2); border-radius: 12px; background: var(--raise); text-align: left;
  }
  .product:hover { border-color: #2a4670; }
  .product-name { font-weight: 600; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .product-id { color: var(--faint); font: 500 15px var(--font-c); }
  .chev { margin-left: auto; flex: none; color: var(--muted); }
  .product[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .picker {
    position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; right: 0; max-width: 560px;
    padding: 8px; border: 1px solid var(--line-2); border-radius: 12px; background: #09111f;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.6);
  }
  .picker input {
    width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 9px;
    background: var(--bg); outline: none;
  }
  .picker input:focus { border-color: var(--accent); }
  .picker-list { max-height: min(60vh, 440px); overflow-y: auto; overscroll-behavior: contain; margin-top: 6px; }
  .picker-list [data-id] {
    display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%;
    min-height: 42px; padding: 8px 10px; border-radius: 8px; text-align: left;
  }
  .picker-list [data-id]:hover, .picker-list [data-id]:focus-visible { background: var(--raise-2); outline: none; }
  .picker-list [aria-selected="true"] { color: var(--accent); }
  .pid { color: var(--faint); font: 500 14px var(--font-c); }
  .picker-group { margin: 10px 10px 4px; font-size: 13px; color: var(--faint); }
  .picker-empty { margin: 14px 10px; color: var(--muted); }

  .quals { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; padding: 2px; scrollbar-width: none; }
  .quals::-webkit-scrollbar, .ranges::-webkit-scrollbar, .modules::-webkit-scrollbar, .subnav::-webkit-scrollbar { display: none; }
  .quals button {
    flex: none; min-width: 46px; height: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px;
    color: var(--text); font: 600 15px/1 var(--font-c);
  }
  .quals button.empty { color: var(--faint); border-style: dashed; }
  .quals button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  .alert {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 14px;
    border: 1px solid #51243a; border-radius: 12px; background: #16080f; color: #ffc0cd;
  }
  .btn { flex: none; height: 36px; padding: 0 14px; border-radius: 9px; background: #2a1020; color: #ffd6df; font-weight: 600; }

  /* Başlık ve fiyat */
  .hero { padding: 2px 2px 0; }
  .hero-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; }
  .hero-title { margin: 0; font-size: 23px; font-weight: 600; line-height: 1.2; }
  .qtag { margin-left: 4px; padding: 1px 7px; border: 1px solid var(--line-2); border-radius: 7px; color: var(--accent); font: 600 15px/1.4 var(--font-c); vertical-align: 2px; }
  .qtag:empty { display: none; }
  .fresh { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .fresh[data-level="live"] .dot { background: var(--up); box-shadow: 0 0 0 4px rgba(70, 240, 160, 0.14); }
  .fresh[data-level="late"] .dot { background: var(--late); }
  .fresh[data-level="stale"] .dot { background: var(--down); }
  .fresh[data-level="stale"] { color: #ffb3c2; }
  .icon-btn { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 9px; color: var(--muted); }
  .icon-btn:hover { background: var(--raise); color: var(--text); }
  .icon-btn.spin svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hero-price { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin: 6px 0 0; }
  .price { color: var(--price); font: 600 clamp(44px, 9vw, 64px)/1 var(--font-c); letter-spacing: -0.01em; }
  .price.none { color: var(--faint); font-size: clamp(32px, 6vw, 44px); }
  .chg { color: var(--muted); font: 600 18px/1 var(--font-c); }
  .chg.up { color: var(--up); }
  .chg.down { color: var(--down); }

  .dayrange {
    display: grid; grid-template-columns: auto minmax(60px, 1fr) auto; align-items: center; gap: 3px 14px;
    max-width: 560px; margin-top: 16px; font: 600 16px var(--font-c);
  }
  .dr-cap { font: 400 13px var(--font); color: var(--muted); }
  .dr-end, .dr-hi { text-align: right; }
  .dr-lo { color: var(--low); }
  .dr-hi { color: var(--high); }
  .track { position: relative; height: 6px; border-radius: 3px; background: linear-gradient(90deg, rgba(114, 255, 143, 0.35), rgba(255, 190, 74, 0.35)); }
  .mark { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: var(--price); box-shadow: 0 0 0 3px var(--bg), 0 0 12px rgba(60, 239, 255, 0.6); transform: translate(-50%, -50%); transition: left 0.42s cubic-bezier(0.65, 0, 0.35, 1); }

  .figs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; margin: 18px 0 0; }
  @media (min-width: 640px) { .figs { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .figs div { padding-top: 8px; border-top: 1px solid var(--line); }
  .figs dt { font-size: 13px; color: var(--muted); }
  .figs dd { margin: 3px 0 0; font: 600 20px/1.2 var(--font-c); }

  /* Grafik */
  .plot { position: relative; padding: 12px 12px 10px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; }
  .plot::before { content: ""; position: absolute; top: 0; left: 0; height: 2px; width: 30%; background: var(--accent); opacity: 0; }
  .plot[aria-busy="true"]::before { opacity: 0.8; animation: busy 1.1s ease-in-out infinite; }
  @keyframes busy { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  .ranges { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 11px; background: var(--bg); overflow-x: auto; scrollbar-width: none; }
  .ranges button { flex: 1 1 0; min-width: 0; height: 36px; padding: 0 2px; border-radius: 8px; color: var(--muted); font: 600 15px/1 var(--font-c); white-space: nowrap; }
  .ranges button:hover { color: var(--text); }
  .ranges button[aria-checked="true"] { background: var(--raise-2); color: var(--accent); }
  .legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
  @media (max-width: 600px) { .legend { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .lg {
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; min-height: 54px;
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; text-align: left; transition: opacity 0.2s, border-color 0.2s;
  }
  .lg-head { display: flex; align-items: center; gap: 7px; font-size: 13px; line-height: 1.2; }
  .lg:hover { border-color: var(--line-2); }
  .lg[aria-pressed="false"] { opacity: 0.42; }
  .lg[aria-pressed="false"] .lg-label { text-decoration: line-through; }
  .sw { flex: none; width: 16px; border-top: 2px solid var(--c); }
  .sw.dash { border-top-style: dashed; }
  .sw.bar { width: 10px; height: 12px; border: 0; border-radius: 2px 2px 0 0; background: var(--c); }
  .lg-label { color: var(--muted); }
  .lg-val { font: 600 17px/1.1 var(--font-c); }
  .when { min-height: 20px; margin: 10px 2px 0; font-size: 13px; color: var(--muted); }
  .chart { position: relative; height: clamp(270px, 46vh, 460px); margin: 4px -4px 0; touch-action: pan-y; }
  .chart-canvas { position: absolute; inset: 0; display: block; touch-action: pan-y; outline-offset: -2px; }
  .chart-msg { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; padding: 24px; text-align: center; color: var(--muted); }
  .foot { margin: 8px 2px 0; font-size: 12.5px; line-height: 1.5; color: var(--faint); max-width: 76ch; }

  /* Kalite tablosu */
  .quality { padding: 14px 4px 6px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
  .quality-title { margin: 0 12px 8px; font-size: 16px; font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  .qt { width: 100%; min-width: 400px; border-collapse: collapse; }
  .qt th, .qt td { padding: 0 9px; text-align: right; white-space: nowrap; }
  @media (max-width: 600px) { .qt th, .qt td { padding: 0 7px; } .sbar { display: none; } }
  .qt thead th { height: 34px; border-bottom: 1px solid var(--line); color: var(--faint); font-size: 13px; font-weight: 500; }
  .qt tbody th, .qt tbody td, .qt tfoot th, .qt tfoot td { height: 42px; font: 500 15px var(--font-c); }
  .qt tbody tr { border-bottom: 1px solid rgba(20, 34, 58, 0.7); cursor: pointer; }
  .qt tbody tr:hover { background: rgba(143, 211, 255, 0.04); }
  .qt th:first-child { text-align: left; }
  .qt tbody th button { min-width: 44px; height: 32px; text-align: left; font: 600 15px var(--font-c); }
  .qt tr.none { color: var(--faint); }
  .qt tr.sel { background: rgba(143, 211, 255, 0.09); }
  .qt tr.sel th { box-shadow: inset 3px 0 0 var(--accent); }
  .qt tr.sel th button { color: var(--accent); }
  .sbar { display: inline-block; width: 28px; height: 5px; margin-right: 7px; border-radius: 3px; background: var(--raise-2); vertical-align: middle; overflow: hidden; }
  .sbar i { display: block; height: 100%; border-radius: 3px; background: #4a86ff; }
  .qt tfoot th, .qt tfoot td { color: var(--muted); font-weight: 600; }

  /* Sıradaki modüller */
  .soon { max-width: 640px; padding: 40px 4px; }
  .soon h1 { margin: 0 0 10px; font-size: 26px; }
  .soon p { margin: 0 0 22px; color: var(--muted); line-height: 1.6; }
  .soon a { color: var(--accent); }

  /* Telefon: temel kurallardan sonra gelmeli */
  @media (max-width: 600px) {
    .plot { padding: 10px 8px 8px; }
    .ranges button { font-size: 14px; }
  }
  @media (max-width: 400px) { .ranges { gap: 0; padding: 2px; } .ranges button { font-size: 13px; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#borsa">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 22l7-7 5 4 7-10 5 5" fill="none" stroke="#3cefff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    DentSimco
  </a>
  <nav class="modules" aria-label="Modüller">
    <a href="#borsa" data-nav="borsa">Borsa</a>
    <a href="#uretim" data-nav="kar">Kâr Hesaplayıcı</a>
  </nav>
  <div class="realm" role="group" aria-label="Realm">
    <button type="button" data-realm="0" aria-pressed="true" title="Realm 1">R1</button>
    <button type="button" data-realm="1" aria-pressed="false" title="Realm 2">R2</button>
  </div>
</header>
<nav class="subnav" id="subnav" aria-label="Kâr Hesaplayıcı bölümleri">
  <a href="#uretim" data-sub="uretim">Üretim</a>
  <a href="#perakende" data-sub="perakende">Perakende</a>
  <a href="#yonetim" data-sub="yonetim">Yönetim</a>
</nav>
<main id="app"></main>
<noscript><p style="padding:20px">DentSimco için JavaScript açık olmalı.</p></noscript>

<script type="module">
  const app = document.getElementById('app');
  const realmButtons = [...document.querySelectorAll('[data-realm]')];
  const navLinks = [...document.querySelectorAll('[data-nav]')];
  const subNav = document.getElementById('subnav');
  const subLinks = [...subNav.querySelectorAll('[data-sub]')];
  const CALC = new Set(['uretim', 'perakende', 'yonetim']); // Kâr Hesaplayıcı'nın bölümleri

  const MODULES = {
    borsa: () => import('./borsa.js').then((m) => m.mountBorsa),
    uretim: () => import('./uretim.js').then((m) => m.mountUretim),
    yonetim: () => import('./yonetim.js').then((m) => m.mountYonetim),
    perakende: () => import('./perakende.js').then((m) => m.mountPerakende),
  };

  let realm = 0;
  try { realm = localStorage.getItem('dentsimco.realm') === '1' ? 1 : 0; } catch { realm = 0; }
  let current = null;
  let currentKey = null;
  let routeToken = 0;

  function paintRealm() {
    for (const b of realmButtons) b.setAttribute('aria-pressed', String(Number(b.dataset.realm) === realm));
  }
  for (const b of realmButtons) {
    b.addEventListener('click', () => {
      const next = Number(b.dataset.realm);
      if (next === realm) return;
      realm = next;
      try { localStorage.setItem('dentsimco.realm', String(realm)); } catch { /* gizli sekme */ }
      paintRealm();
      current?.setRealm(realm);
    });
  }

  async function route() {
    const head = location.hash.slice(1).split('/')[0]; // #uretim/binalar → uretim (alt sekmeyi modül okur)
    const key = MODULES[head] ? head : 'borsa';
    if (key === currentKey) return;
    const my = ++routeToken;
    currentKey = key;
    const top = CALC.has(key) ? 'kar' : key;
    for (const a of navLinks) {
      if (a.dataset.nav === top) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    }
    subNav.classList.toggle('on', CALC.has(key));
    for (const a of subLinks) {
      if (a.dataset.sub === key) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    }
    try {
      const mount = await MODULES[key]();
      if (my !== routeToken) return;
      current?.destroy();
      current = mount(app, { realm });
    } catch (e) {
      console.error(e);
      app.innerHTML = '<section class="soon"><h1>Sayfa açılamadı</h1><p>Dosyalardan biri yüklenemedi. Sayfayı yenile; düzelmezse GitHub > Actions > DentSimco Site sonucuna bak.</p></section>';
    }
  }

  window.addEventListener('hashchange', route);
  paintRealm();
  route();
</script>
</body>
</html>
